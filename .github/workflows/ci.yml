name: CI
on:
  push:
    branches: [main, ios]
  pull_request:
jobs:
  test:
    # Work-in-progress checkpoints ("WIP: …") are saved while features are mid-build; only finished work is tested.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'WIP') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
