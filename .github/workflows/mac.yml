name: Mac app
on:
  push:
    branches: [mac-app]
  workflow_dispatch:
jobs:
  dmg:
    # Same rule as ci.yml: "WIP: …" checkpoints are not built.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'WIP') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Native audio engine + plugin host: compile (universal arm64/x86_64) and run the C++ unit tests
      # (ring buffer, engine on the null backend + rate renegotiation, CLAP / VST3 test plugins: sample-accurate
      # params, sidechain + multi-out buses, presets; Apple's AUs; the Ableton Link process) first — fast failures.
      - name: Native layer + native tests
        run: sh desktop/native/build.sh --test
      # JS tests; with the native build present they also drive the real addon + plugin host end to end.
      - run: npm test
      - run: npm install --no-audit --no-fund
      # electron-builder makes the .app + .zip; the .dmg is packed by hdiutil create -srcfolder (no attach/detach —
      # electron-builder's dmg target fails on these runners with "hdiutil detach: resource busy")
      - name: Build Apple Silicon app + .zip (ad-hoc signed, not notarized)
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Intel app + .zip
        run: npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Both apps carry the universal native layer (addon + plugin host) and the unpacked bridge modules
      - name: Check the native layer inside the apps
        run: |
          for app in $(find dist -maxdepth 2 -name 'daW3.app'); do
            n="$app/Contents/Resources/native"
            ls -la "$n"
            lipo -info "$n/daw3-plughost" "$n/daw3_audio.node" "$n/daw3-link"
            test -f "$app/Contents/Resources/app.asar.unpacked/src/native/protocol.js"
            "$n/daw3-plughost" --describe au all | head -c 400; echo
            "$n/daw3-link" --version
          done
      - name: Pack .dmg files
        run: bash scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: daW3-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
