name: Release
# Tag vX.Y.Z -> build + test + smoke-test all three desktop platforms (desktop.yml), then publish a GitHub Release
# with every installer attached and the matching CHANGELOG.md section as the notes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release, e.g. v1.0.0
        required: true

permissions:
  contents: write

jobs:
  desktop:
    uses: ./.github/workflows/desktop.yml

  release:
    needs: desktop
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: daW3-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: smoke-*
          path: smoke
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${TAG#v}"
          test "$VERSION" = "$(node -p "require('./package.json').version")" || { echo "tag $TAG does not match package.json"; exit 1; }
          # the "## [x.y.z]" / "## x.y.z" section, up to the next "## "
          awk -v v="$VERSION" '
            /^## / { if (on) exit; if (index($0, "[" v "]") || $2 == v) { on = 1; next } }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for $VERSION"; exit 1; }
          {
            echo
            echo "### Downloads"
            echo "- **macOS** (Apple Silicon / Intel): \`daW3-$VERSION-arm64.dmg\` / \`daW3-$VERSION-x64.dmg\` — ad-hoc signed, not notarized: after copying to Applications run \`xattr -dr com.apple.quarantine /Applications/daW3.app\` (or right-click → Open)."
            echo "- **Windows** (x64 / arm64): \`daW3-Setup-$VERSION-x64.exe\` / \`daW3-Setup-$VERSION-arm64.exe\` installer, or the portable \`.zip\` — unsigned: SmartScreen → *More info* → *Run anyway*."
            echo "- **Linux** (x64): \`daW3-$VERSION-linux-x86_64.AppImage\` (\`chmod +x\`, run), \`daw3_${VERSION}_amd64.deb\` (\`sudo apt install ./daw3_${VERSION}_amd64.deb\`), or the \`.tar.gz\`."
            echo "- **Web** (no install): https://coral-coder.github.io/daw3/ · phones: https://coral-coder.github.io/daw3/pocket/"
          } >> notes.md
          cat notes.md
          ls -la assets smoke
      - name: Publish the GitHub Release
        run: |
          shopt -s nullglob
          files=(assets/*.dmg assets/*.zip assets/*.exe assets/*.AppImage assets/*.deb assets/*.tar.gz)
          printf '%s\n' "${files[@]}"
          for need in "-arm64.dmg" "-x64.dmg" "-x64.exe" ".AppImage" ".deb"; do
            ls assets | grep -q -- "$need" || { echo "missing asset *$need"; exit 1; }
          done
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file notes.md --title "daW³ ${TAG#v}"
          else
            gh release create "$TAG" "${files[@]}" --title "daW³ ${TAG#v}" --notes-file notes.md --verify-tag
          fi
          gh release view "$TAG"
